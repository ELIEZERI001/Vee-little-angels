<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up — Victory Little Angels</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="container topbar-inner">
      <span>🚚 Free delivery on orders above Ksh 2,000</span>
      <span>📞 +254 745 682 817</span>
    </div>
  </div>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">🍼</span>
        <span class="logo-text">Victory <strong>Little Angels</strong></span>
      </a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="auth-page">
    <div class="auth-box">

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="auth-form active" id="loginForm">
        <h2>Welcome Back 👋</h2>
        <p class="auth-sub">Login to your account</p>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="you@email.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary auth-submit">Login</button>
        <p class="auth-error" id="loginError"></p>
      </form>

      <!-- SIGNUP FORM -->
      <form class="auth-form" id="signupForm">
        <h2>Create Account ✨</h2>
        <p class="auth-sub">Join Victory Little Angels</p>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" required placeholder="Jane Wanjiku">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" required placeholder="you@email.com">
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="signupPhone" required placeholder="0712 345 678">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" required placeholder="Min. 6 characters">
        </div>

        <button type="submit" class="btn btn-primary auth-submit">Create Account</button>
        <p class="auth-error" id="signupError"></p>
      </form>

    </div>
  </main>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
