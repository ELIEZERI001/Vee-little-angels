<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Victory Little Angels</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FFF0F5, #E8F6FF);
      text-align: center;
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 20px;
    }
    .box { padding: 40px; max-width: 500px; }
    .box h1 {
      font-size: 90px;
      color: #FF6B9D;
      margin: 0 0 10px;
      font-family: 'Poppins', sans-serif;
    }
    .box h2 { font-size: 22px; margin: 0 0 12px; }
    .box p { color: #666; margin-bottom: 28px; font-size: 15px; }
    .box a {
      display: inline-block;
      background: #FF6B9D;
      color: #fff;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.3s;
    }
    .box a:hover { background: #E85A8A; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Oops! Page not found 🍼</h2>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="index.html">← Back to Home</a>
  </div>
</body>
</html>
